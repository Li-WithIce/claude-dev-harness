name: Validation

on:
  pull_request:
  push:
    branches:
      - main
      - codex/harness-distribution

permissions:
  contents: read

jobs:
  validation:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Full validation
        shell: pwsh
        run: pwsh -NoLogo -NoProfile -NonInteractive -File scripts/run-validation.ps1 -Suite all -CheckTimeoutSeconds 360

      - name: Isolated installation verification
        shell: pwsh
        run: pwsh -NoLogo -NoProfile -NonInteractive -File scripts/run-isolated-install-smoke.ps1 -RepoRoot $PWD
